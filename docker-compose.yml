name: catraca

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
    # No host port on purpose: only the app talks to the DB. Debug with
    # `docker compose exec db psql -U catraca`.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca -d catraca"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://catraca:catraca@db:5432/catraca
      PORT: "3000"
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-partner-dev-key}
      GATEWAY_DELAY_SCALE: ${GATEWAY_DELAY_SCALE:-1}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
